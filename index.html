<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#c2410c">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gestione Calore">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Gestione Calore</title>
<link rel="stylesheet" href="styles.css?v=11">
</head>
<body>
<div id="login" class="login hidden">
  <form id="loginForm" class="card">
    <h1>Gestione Calore</h1>
    <p class="muted">Accesso riservato</p>
    <div id="stepEmail">
      <label>Email<input id="email" type="email" required autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="la tua email"></label>
      <label>Password<input id="pwd" type="password" required autocomplete="current-password" placeholder="la tua password"></label>
      <label class="chk"><input type="checkbox" id="showpwd" style="width:auto"> Mostra password</label>
      <button type="submit" id="entra">Entra</button>
      <button type="button" id="linkMail" class="ghost">Inviami un link per email</button>
      <p class="hint">Dall’app sulla schermata Home entra con la password: il link ricevuto per email si apre nel browser e non nell’app, e funziona una sola volta.</p>
    </div>
    <div id="stepCode" class="hidden">
      <p class="muted">Ti ho inviato un link per email: aprilo da questo browser per entrare.</p>
      <input id="code" type="hidden"><button type="button" id="back" class="ghost">Cambia email</button>
    </div>
    <p id="loginMsg" class="msg"></p>
  </form>
</div>
<div id="app" class="hidden">
  <header>
    <strong>Gestione Calore</strong>
    <input id="search" type="search" placeholder="Cerca in questa sezione…">
    <span id="who" class="muted"></span>
    <button id="logout" class="ghost">Esci</button>
  </header>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<dialog id="dlg"><form method="dialog" id="dform"></form></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="app.js?v=11"></script>
</body>
</html>
