<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#3a1c10">
<link rel="manifest" href="manifest.json?v=2">
<link rel="icon" type="image/png" href="icon-192.png?v=2">
<link rel="apple-touch-icon" href="icon-192.png?v=2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gestione Calore">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Gestione Calore</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<link rel="stylesheet" href="styles.css?v=22">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
<linearGradient id="gf" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#e11d48"/><stop offset=".55" stop-color="#f97316"/><stop offset="1" stop-color="#fcd34d"/></linearGradient>
<symbol id="flame" viewBox="0 0 32 32"><path d="M16 2c1 5 7 8 7 15a7 7 0 0 1-14 0c0-3 1.5-4.8 3-6.5.3 2 1.2 3 2.3 3.5C14 10 14.5 6 16 2z" fill="url(#gf)"/><path d="M16 15c.6 2.4 3.2 3.6 3.2 6.4a3.2 3.2 0 0 1-6.4 0c0-1.6.9-2.6 1.8-3.6.2 1 .6 1.5 1.1 1.7C15.5 18 15.6 16.4 16 15z" fill="#fff7ed" opacity=".93"/></symbol>
<symbol id="flame1" viewBox="0 0 32 32"><path d="M16 2c1 5 7 8 7 15a7 7 0 0 1-14 0c0-3 1.5-4.8 3-6.5.3 2 1.2 3 2.3 3.5C14 10 14.5 6 16 2z" fill="currentColor"/></symbol>
</defs></svg>
<div id="login" class="login hidden">
  <form id="loginForm" class="card">
    <div class="logo"><svg viewBox="0 0 32 32" aria-hidden="true"><use href="#flame"/></svg><h1>Gestione Calore</h1><p class="muted">Accesso riservato</p></div>
    <div id="stepEmail">
      <label>Email<input id="email" type="email" required autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="la tua email"></label>
      <label>Password<input id="pwd" type="password" required autocomplete="current-password" placeholder="la tua password"></label>
      <label class="chk"><input type="checkbox" id="showpwd" style="width:auto"> Mostra password</label>
      <button type="submit" id="entra">Entra</button>
      <button type="button" id="linkMail" class="ghost">Inviami un link per email</button>
      <p class="hint">Dall’app sulla schermata Home entra con la password: il link ricevuto per email si apre nel browser e non nell’app, e funziona una sola volta.</p>
    </div>
    <div id="stepCode" class="hidden">
      <p class="muted">Ti ho inviato un link per email: aprilo da questo browser per entrare.</p>
      <input id="code" type="hidden"><button type="button" id="back" class="ghost">Cambia email</button>
    </div>
    <p id="loginMsg" class="msg"></p>
  </form>
</div>
<div id="app" class="hidden">
  <header>
    <a class="brand" href="./" aria-label="Gestione Calore"><svg viewBox="0 0 32 32" aria-hidden="true"><use href="#flame"/></svg><span><b>Gestione Calore</b><small>MM · Impianti termici</small></span></a>
    <div class="srch"><input id="search" type="search" placeholder="Cerca in questa sezione…"><button id="ovunque" type="button" class="ghost" aria-pressed="false" title="Cerca in tutta l'app (impianti, contratti, normativa, appunti…)">Ovunque</button></div>
    <span id="who" class="muted"></span>
    <button id="logout" class="ghost" title="Esci" aria-label="Esci"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg><span class="tx">Esci</span></button>
  </header>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<dialog id="dlg"><form method="dialog" id="dform"></form></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="app.js?v=62"></script>
<script src="consulente.js?v=1"></script>
</body>
</html>
