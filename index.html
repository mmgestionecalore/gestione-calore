<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Gestione Calore</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="login" class="login hidden">
  <form id="loginForm" class="card">
    <h1>Gestione Calore</h1>
    <p class="muted">Accesso riservato</p>
    <div id="stepEmail">
      <label>Email aziendale<input id="email" type="email" required autocomplete="email" placeholder="nome.cognome@mmspa.eu"></label>
      <button type="submit">Invia link di accesso</button>
    </div>
    <div id="stepCode" class="hidden">
      <p class="muted">Ti ho inviato un link per email: aprilo da questo browser per entrare.</p>
      <input id="code" type="hidden"><button type="button" id="back" class="ghost">Cambia email</button>
    </div>
    <p id="loginMsg" class="msg"></p>
  </form>
</div>
<div id="app" class="hidden">
  <header>
    <strong>Gestione Calore</strong>
    <input id="search" type="search" placeholder="Cerca in questa sezione…">
    <span id="who" class="muted"></span>
    <button id="logout" class="ghost">Esci</button>
  </header>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<dialog id="dlg"><form method="dialog" id="dform"></form></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
</body>
</html>
